[build]
  command = "pnpm --filter @workspace/wdm run build"
  publish = "artifacts/wdm/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT         = "3000"
  BASE_PATH    = "/"

# ── Netlify Forms ─────────────────────────────────────────────────────────────
# The contact form at /contact is wired to Netlify Forms via data-netlify="true"
# on the <form> element and a matching build-time declaration in index.html.
#
# After the first deploy, enable email notifications so submissions reach the inbox:
#   1. Go to Netlify dashboard → your site → Forms → "contact"
#   2. Click "Form notifications" → "Add notification" → "Email notification"
#   3. Enter Hello@wdm-group.co.uk as the recipient and save.
#
# Netlify's free tier includes this feature; no paid plan is required.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all routes to index.html so client-side routing works correctly
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
