kind = "web"
previewPath = "/"
title = "Why Design Matters"
version = "1.0.0"
id = "artifacts/wdm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25864

[services.development]
run = "pnpm --filter @workspace/wdm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wdm", "run", "build" ]
publicDir = "artifacts/wdm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25864"
BASE_PATH = "/"
